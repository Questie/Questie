name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  tests:
    uses: './.github/workflows/ci.yml'
    with:
      event_name: ${{ github.event_name }}
      repo_full_name: ${{ github.repository }}
  publish:
    runs-on: ubuntu-latest
    needs: [ tests ]

    env:
      GH_TOKEN: ${{ github.token }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 100

      - name: Fetch tags
        run: git fetch --prune --unshallow --tags

      - name: Build ZIP
        run: python build.py -r

      - name: Generate Changelog
        id: changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python changelog.py --questiedb-manifest "releases/$RELEASE_TAG/questiedb-release.json" >> CHANGELOG.md

      - name: Create GitHub release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_dir="releases/$RELEASE_TAG"
          standalone_zip=$(jq -r '.standalone_zip' "$release_dir/build-result.json")
          combined_zip=$(jq -r '.combined_zip' "$release_dir/build-result.json")
          if [[ "$RELEASE_TAG" == *"-b"* ]]; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --prerelease \
              -F CHANGELOG.md \
              "$release_dir/$standalone_zip" \
              "$release_dir/$combined_zip" \
              "$release_dir/release.json" \
              "$release_dir/questiedb-release.json"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              -F CHANGELOG.md \
              "$release_dir/$standalone_zip" \
              "$release_dir/$combined_zip" \
              "$release_dir/release.json" \
              "$release_dir/questiedb-release.json"
          fi

      # External publishing is hard-disabled while the bundle release flow is prepared.
      # Keep disabled until explicitly approved; see PLAN-release-bundles.md.
      # Upload jobs will need their own scoped credentials when enabled.
      # - name: Upload CurseForge
      #   run: sh upload-cf.sh ${{github.ref_name}}

      # - name: Upload WAGO
      #   run: sh upload-wago.sh ${{github.ref_name}}

      - name: Send CI failure to Discord
        uses: nebularg/actions-discord-webhook@v1.0.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
        if: ${{ failure() }}
