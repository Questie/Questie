name: Build and publish bundle

on:
  workflow_dispatch:
    inputs:
      release:
        description: (--release) Publish a normal release instead of a prerelease
        type: boolean
        default: false
      dry_run:
        description: (--dry-run) Preview release notes and metadata without publishing
        type: boolean
        default: false
      publish_curseforge:
        description: Upload to CurseForge
        type: boolean
        default: false
      publish_wago:
        description: Upload to Wago
        type: boolean
        default: false

jobs:
  tests:
    uses: './.github/workflows/ci.yml'
    with:
      event_name: ${{ github.event_name }}
      repo_full_name: ${{ github.repository }}
  build:
    name: Build bundle
    runs-on: ubuntu-latest
    needs: [ tests ]
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_dir: ${{ steps.metadata.outputs.release_dir }}
      bundled_zip: ${{ steps.metadata.outputs.bundled_zip }}
    permissions:
      contents: read

    env:
      PRERELEASE: ${{ !inputs.release }}

    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 100

      - name: Fetch tags
        run: git fetch --prune --unshallow --tags

      - name: Build ZIP
        run: |
          # --release controls package naming; the checkbox controls GitHub prerelease status.
          python build.py --release --bundled

          echo "RELEASE_DIR=$(dirname releases/*/release.json)" >> "$GITHUB_ENV"

      - name: Generate Changelog
        id: changelog
        run: python changelog.py --release-manifest "$RELEASE_DIR/release.json" >> CHANGELOG.md

      - name: Read release metadata
        id: metadata
        run: |
          # Name the release from the packaged component versions, not the selected Git branch.
          RELEASE_TAG=$(jq -r '"bundle/v" + .questie.version + "+v" + .questiedb.version' "$RELEASE_DIR/release.json")
          BUNDLED_ZIP=$(jq -r '.releases[0].filename' "$RELEASE_DIR/release.json")

          # Separate prereleases from normal releases and distinguish Questie source commits.
          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_TAG+="-pre.${GITHUB_SHA:0:7}"
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "BUNDLED_ZIP=$BUNDLED_ZIP" >> "$GITHUB_ENV"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_dir=$RELEASE_DIR" >> "$GITHUB_OUTPUT"
          echo "bundled_zip=$BUNDLED_ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            ${{ env.RELEASE_DIR }}/${{ env.BUNDLED_ZIP }}
            ${{ env.RELEASE_DIR }}/release.json
            CHANGELOG.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preview artifact
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "# Dry run: $RELEASE_TAG"
            echo
            cat CHANGELOG.md
            echo
            echo '## release.json'
            echo '```json'
            cat "$RELEASE_DIR/release.json"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Send CI failure to Discord
        uses: nebularg/actions-discord-webhook@v1.0.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
        if: ${{ failure() }}

  github:
    name: "GitHub: ${{ needs.build.outputs.release_tag }}"
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      RELEASE_DIR: ${{ needs.build.outputs.release_dir }}
      BUNDLED_ZIP: ${{ needs.build.outputs.bundled_zip }}
      PRERELEASE: ${{ !inputs.release }}
    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: release-bundle

      - name: Create GitHub release
        run: |
          # GitHub creates a missing release tag at the commit used for this build.
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$RELEASE_TAG" \
              --title "${RELEASE_TAG#bundle/}" \
              --target "$GITHUB_SHA" \
              --prerelease \
              -F CHANGELOG.md \
              "$RELEASE_DIR/$BUNDLED_ZIP" \
              "$RELEASE_DIR/release.json"
          else
            gh release create "$RELEASE_TAG" \
              --title "${RELEASE_TAG#bundle/}" \
              --target "$GITHUB_SHA" \
              -F CHANGELOG.md \
              "$RELEASE_DIR/$BUNDLED_ZIP" \
              "$RELEASE_DIR/release.json"
          fi

      - name: Send CI failure to Discord
        uses: nebularg/actions-discord-webhook@v1.0.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
        if: ${{ failure() }}

  curseforge:
    name: "CurseForge: ${{ needs.build.outputs.release_tag }}"
    runs-on: ubuntu-latest
    needs: [ build, github ]
    if: ${{ inputs.publish_curseforge && !inputs.dry_run }}
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      RELEASE_DIR: ${{ needs.build.outputs.release_dir }}
      BUNDLED_ZIP: ${{ needs.build.outputs.bundled_zip }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.1

      - name: Download bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: release-bundle

      - name: Upload to CurseForge
        run: sh upload-cf.sh "$RELEASE_TAG"

      - name: Send CI failure to Discord
        uses: nebularg/actions-discord-webhook@v1.0.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
        if: ${{ failure() }}

  wago:
    name: "Wago: ${{ needs.build.outputs.release_tag }}"
    runs-on: ubuntu-latest
    needs: [ build, github ]
    if: ${{ inputs.publish_wago && !inputs.dry_run }}
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      RELEASE_DIR: ${{ needs.build.outputs.release_dir }}
      BUNDLED_ZIP: ${{ needs.build.outputs.bundled_zip }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.1

      - name: Download bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: release-bundle

      - name: Upload to Wago
        run: sh upload-wago.sh "$RELEASE_TAG"

      - name: Send CI failure to Discord
        uses: nebularg/actions-discord-webhook@v1.0.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
        if: ${{ failure() }}
